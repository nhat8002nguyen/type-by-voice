name: linux-client

on:
  push:
    branches: [main, "feat/linux-client"]
    paths:
      - "linux/**"
      - "contracts/**"
      - "backend/**"
      - ".github/workflows/linux-client.yml"
  pull_request:
    paths:
      - "linux/**"
      - "contracts/**"
      - ".github/workflows/linux-client.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      APP_VERSION: "0.1.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: linux/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-4-dev \
            libgirepository1.0-dev \
            libayatana-appindicator3-dev \
            libpulse-dev \
            libasound2-dev \
            libopus-dev \
            libopusfile-dev \
            libx11-dev \
            libxtst-dev

      - name: Vet and test the pure-Go core
        working-directory: linux
        run: |
          CGO_ENABLED=0 go vet ./core/...
          CGO_ENABLED=0 go test ./core/...

      - name: Test the cgo app layer
        working-directory: linux
        run: CGO_ENABLED=1 go test ./app/...

      - name: Build the binary
        working-directory: linux
        run: |
          mkdir -p build
          CGO_ENABLED=1 go build -trimpath -o build/typebyvoice ./cmd/typebyvoice

      - name: Smoke the dictation contract
        run: |
          cd contracts/dictation-v1
          npm ci
          # The cli-mock speaks dictation v1 end to end; the harness uploads real
          # Ogg Opus and asserts a final comes back, breaking if the contract moves.
          npm test
          npm run harness

      - name: Build AppImage
        working-directory: linux
        run: |
          set -euo pipefail
          APPDIR="$PWD/build/AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/scalable/apps"
          cp build/typebyvoice "$APPDIR/usr/bin/typebyvoice"
          cp packaging/appimage/typebyvoice.svg "$APPDIR/typebyvoice.svg"
          cp packaging/appimage/typebyvoice.svg "$APPDIR/usr/share/icons/hicolor/scalable/apps/"
          cp packaging/appimage/typebyvoice.desktop "$APPDIR/typebyvoice.desktop"
          cp packaging/appimage/typebyvoice.desktop "$APPDIR/usr/share/applications/"
          cp packaging/appimage/AppRun "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun" "$APPDIR/usr/bin/typebyvoice"
          curl -fsSL -o appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "$APPDIR" \
            "build/typebyvoice-${APP_VERSION}-amd64.AppImage"

      - name: Build .deb
        working-directory: linux
        run: |
          set -euo pipefail
          PKG="$PWD/build/pkg"
          rm -rf "$PKG"
          mkdir -p "$PKG/DEBIAN" "$PKG/usr/bin" "$PKG/usr/share/applications" \
                   "$PKG/usr/share/icons/hicolor/scalable/apps"
          cp build/typebyvoice "$PKG/usr/bin/typebyvoice"
          cp packaging/appimage/typebyvoice.svg "$PKG/usr/share/icons/hicolor/scalable/apps/"
          cp packaging/appimage/typebyvoice.desktop "$PKG/usr/share/applications/"
          sed "s/@VERSION@/${APP_VERSION}/" packaging/debian/control > "$PKG/DEBIAN/control"
          cp packaging/debian/postinst "$PKG/DEBIAN/postinst"
          chmod 0755 "$PKG/DEBIAN/postinst"
          dpkg-deb --build --root-owner-group "$PKG" \
            "build/typebyvoice_${APP_VERSION}_amd64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-client-amd64
          path: |
            linux/build/typebyvoice-*-amd64.AppImage
            linux/build/typebyvoice_*_amd64.deb
          if-no-files-found: error
