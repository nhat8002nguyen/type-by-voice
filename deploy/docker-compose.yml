name: type-by-voice

x-app-env: &app-env
  NODE_ENV: production
  NATS_SERVER_HOST: nats-server
  RABBITMQ_HOST: amqp://rabbitmq:5672
  REDIS_HOST: redis
  JWT_SECRET: ${JWT_SECRET}
  TYPEORM_SYNCHRONIZE: ${TYPEORM_SYNCHRONIZE:-false}
  OBSERVE_APP_KEY: ${OBSERVE_APP_KEY:-}
  OBSERVE_APP_SECRET: ${OBSERVE_APP_SECRET:-}

services:
  api:
    image: ghcr.io/${GHCR_OWNER}/type-by-voice-api:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      <<: *app-env
      POSTGRES_HOST: api-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: api
    depends_on:
      - api-db
      - quota-service
      - speech-service
      - workflows-service
      - notifications-service
      - nats-server
      - rabbitmq
      - redis
    deploy:
      resources:
        limits:
          memory: 512M
    mem_limit: 512m

  quota-service:
    image: ghcr.io/${GHCR_OWNER}/type-by-voice-quota-service:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      <<: *app-env
    depends_on:
      - nats-server
    deploy:
      resources:
        limits:
          memory: 256M
    mem_limit: 256m

  speech-service:
    image: ghcr.io/${GHCR_OWNER}/type-by-voice-speech-service:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      <<: *app-env
      SPEECH_PROVIDER: ${SPEECH_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL: ${GROQ_MODEL:-whisper-large-v3-turbo}
    depends_on:
      - nats-server
    deploy:
      resources:
        limits:
          memory: 256M
    mem_limit: 256m

  workflows-service:
    image: ghcr.io/${GHCR_OWNER}/type-by-voice-workflows-service:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      <<: *app-env
      POSTGRES_HOST: workflows-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: workflows
      TRANSCRIPT_ENCRYPTION_KEY: ${TRANSCRIPT_ENCRYPTION_KEY}
    depends_on:
      - workflows-db
      - rabbitmq
      - redis
      - nats-server
    deploy:
      resources:
        limits:
          memory: 256M
    mem_limit: 256m

  notifications-service:
    image: ghcr.io/${GHCR_OWNER}/type-by-voice-notifications-service:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      <<: *app-env
      POSTGRES_HOST: notifications-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: notifications
    depends_on:
      - notifications-db
      - rabbitmq
      - redis
    deploy:
      resources:
        limits:
          memory: 256M
    mem_limit: 256m

  api-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: api
    volumes:
      - api-db-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M
    mem_limit: 256m

  quota-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: quota
    volumes:
      - quota-db-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 128M
    mem_limit: 128m

  workflows-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: workflows
    volumes:
      - workflows-db-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M
    mem_limit: 256m

  notifications-db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: notifications
    volumes:
      - notifications-db-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 128M
    mem_limit: 128m

  nats-server:
    image: nats:2-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
    mem_limit: 64m

  rabbitmq:
    image: rabbitmq:3-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    mem_limit: 256m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    deploy:
      resources:
        limits:
          memory: 64M
    mem_limit: 64m

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - api
    mem_limit: 64m

  certbot:
    image: certbot/certbot:v3.1.0
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
      - ./scripts/certbot-loop.sh:/certbot-loop.sh:ro
      # Needed so renew can `docker exec` nginx -s reload after cert changes.
      # Security tradeoff: grants this container Docker daemon control — keep image pinned.
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["/bin/sh", "/certbot-loop.sh"]
    mem_limit: 64m

volumes:
  api-db-data:
  quota-db-data:
  workflows-db-data:
  notifications-db-data:
  certbot-www:
  certbot-certs:
