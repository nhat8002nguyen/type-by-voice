upstream tbv_api {
  server api:3000;
  keepalive 16;
}

# Client address resolution.
#
# Requests arrive either straight from the caller (DNS-only record) or through a
# Cloudflare edge (proxied record). Cloudflare publishes the true caller in
# CF-Connecting-IP, but that header is only trustworthy when the peer really is a
# Cloudflare edge -- a direct caller could forge it. `geo` decides that, `map` then
# picks the address nginx forwards, and both proxy locations overwrite X-Real-IP /
# X-Forwarded-For with it. The API reads that one validated value, so per-IP rate
# limits bucket by caller instead of collapsing into a single bucket for the proxy.
#
# Refresh the ranges from https://api.cloudflare.com/client/v4/ips.
geo $tbv_peer_is_cloudflare {
  default 0;
  173.245.48.0/20 1;
  103.21.244.0/22 1;
  103.22.200.0/22 1;
  103.31.4.0/22 1;
  141.101.64.0/18 1;
  108.162.192.0/18 1;
  190.93.240.0/20 1;
  188.114.96.0/20 1;
  197.234.240.0/22 1;
  198.41.128.0/17 1;
  162.158.0.0/15 1;
  104.16.0.0/13 1;
  104.24.0.0/14 1;
  172.64.0.0/13 1;
  131.0.72.0/22 1;
  2400:cb00::/32 1;
  2606:4700::/32 1;
  2803:f800::/32 1;
  2405:b500::/32 1;
  2405:8100::/32 1;
  2a06:98c0::/29 1;
  2c0f:f248::/32 1;
}

# The combined key starts with 1 only when the peer is a Cloudflare edge, so a
# forged CF-Connecting-IP arriving from anywhere else falls back to $remote_addr.
map $tbv_peer_is_cloudflare$http_cf_connecting_ip $tbv_client_ip {
  default $remote_addr;
  ~^1.+$ $http_cf_connecting_ip;
}

server {
  listen 80;
  server_name tbv-api.nate-ng.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name tbv-api.nate-ng.com;

  ssl_certificate /etc/letsencrypt/live/tbv-api.nate-ng.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tbv-api.nate-ng.com/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;

  # HTTP-01 challenges must resolve over TLS as well. If anything in front forces
  # HTTPS (Cloudflare's "Always Use HTTPS"), the challenge arrives on 443, and
  # without this location it would fall through to `location /`, be proxied to the
  # API, and 404 — silently breaking renewals.
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $tbv_client_ip;
    proxy_set_header X-Forwarded-For $tbv_client_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_pass http://tbv_api;
  }

  # WebSocket dictation
  location /v1/dictate {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $tbv_client_ip;
    proxy_set_header X-Forwarded-For $tbv_client_ip;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_pass http://tbv_api;
  }
}
